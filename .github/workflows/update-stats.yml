name: update stats

# Public stat services only count public repositories, so they report close to
# zero for this account. This job rebuilds the cards from the authenticated API,
# which can see private work too.
#
# Needs the GH_STATS_TOKEN secret: a token with the `repo` scope. Without it the
# job fails on purpose, so a missing or expired token shows up as a red run (and
# an email) instead of cards that silently stop updating.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-stats.mjs"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The default GITHUB_TOKEN cannot see private repositories: running with it
      # would rewrite the cards with public-only numbers (6 repos, 15 commits).
      - name: Check credentials
        env:
          STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN is not set. The default token sees only public repos and would overwrite the cards with wrong numbers."
            exit 1
          fi

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contributions.svg assets/languages.svg README.md
          if git diff --staged --quiet; then
            echo "No change in the generated cards."
          else
            git commit -m "Refresh stat cards"
            git push
          fi
